<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Wheel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: radial-gradient(circle at top, #2b1055, #0b0a12 70%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-x: hidden;
}
.app { display: flex; gap: 40px; flex-wrap: wrap; align-items: center; justify-content: center; max-width: 1000px; width: 100%; }
.wheel-box { position: relative; width: 440px; max-width: 90vw; }
canvas#wheel { width: 100%; height: auto; filter: drop-shadow(0 0 25px #a855f7aa); }
.pointer {
  position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 38px solid #fff;
  filter: drop-shadow(0 2px 6px #000); z-index: 2;
}
.spin-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 90px; height: 90px; border-radius: 50%; border: 4px solid #fff;
  background: linear-gradient(135deg, #a855f7, #6d28d9);
  color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; z-index: 3;
  box-shadow: 0 0 20px #a855f7;
}
.spin-btn:disabled { opacity: .6; cursor: not-allowed; }
.panel {
  background: #ffffff10; border: 1px solid #ffffff25; border-radius: 18px;
  padding: 24px; width: 320px; max-width: 90vw; backdrop-filter: blur(10px);
}
.panel h2 { margin-bottom: 12px; }
textarea {
  width: 100%; height: 220px; resize: vertical; border-radius: 12px;
  border: 1px solid #ffffff30; background: #00000060; color: #fff; padding: 12px; font-size: 16px;
}
.hint { font-size: 13px; opacity: .7; margin-top: 8px; }
.winner {
  margin-top: 16px; padding: 14px; border-radius: 12px;
  background: linear-gradient(135deg, #a855f740, #6d28d940);
  text-align: center; font-size: 20px; min-height: 54px;
}
.winner.celebrate { animation: pop 0.8s ease-out, glow 1.6s ease-in-out 3; }
@keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 10px #a855f7; } 50% { box-shadow: 0 0 45px #fde047, 0 0 80px #ec4899; } }
#overlay {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  flex-direction: column; background: #000000b0; z-index: 10; text-align: center;
}
#overlay.show { display: flex; animation: fade 0.4s ease-out; }
#overlay .big {
  font-size: clamp(36px, 9vw, 90px); font-weight: 900;
  background: linear-gradient(90deg, #fde047, #ec4899, #a855f7, #fde047);
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shine 2s linear infinite, pop 0.8s ease-out; padding: 0 20px;
}
#overlay .sub { margin-top: 10px; font-size: 22px; opacity: .9; }
#overlay button {
  margin-top: 28px; padding: 12px 28px; border-radius: 30px; border: none;
  background: linear-gradient(135deg, #a855f7, #6d28d9); color: #fff; font-size: 18px; cursor: pointer;
}
@keyframes shine { to { background-position: 300% 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

/* Chat-Schalter */
.toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #00000040; }
.switch { position: relative; width: 50px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; inset: 0; background: #555; border-radius: 26px; cursor: pointer; transition: .3s; }
.slider:before { content: ''; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
.switch input:checked + .slider { background: #a855f7; }
.switch input:checked + .slider:before { transform: translateX(24px); }
.status { font-size: 13px; margin-top: 8px; opacity: .85; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; margin-right: 6px; }
.dot.on { background: #22c55e; }
</style>
</head>
<body>

<canvas id="confetti"></canvas>

<div id="overlay">
  <div class="sub">🎉 Gewinner 🎉</div>
  <div class="big" id="bigName"></div>
  <button id="closeBtn">Weiter</button>
</div>

<div class="app">
  <div class="wheel-box">
    <div class="pointer"></div>
    <canvas id="wheel" width="600" height="600"></canvas>
    <button class="spin-btn" id="spin">DREHEN</button>
  </div>

  <div class="panel">
    <h2>Namen</h2>
    <textarea id="names" placeholder="Ein Name pro Zeile">Anna
Ben
Chris
Dilara
Emil
Fynn</textarea>
    <p class="hint">Ein Name pro Zeile. Das Rad aktualisiert sich automatisch.</p>

    <div class="toggle-row">
      <span>Chat-Anmeldung (!join)</span>
      <label class="switch">
        <input type="checkbox" id="joinToggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Nicht verbunden</span></div>

    <div class="winner" id="winner">Dreh am Rad!</div>
  </div>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const textarea = document.getElementById('names');
const spinBtn = document.getElementById('spin');
const winnerEl = document.getElementById('winner');
const overlay = document.getElementById('overlay');
const bigName = document.getElementById('bigName');
const closeBtn = document.getElementById('closeBtn');
const confCanvas = document.getElementById('confetti');
const cctx = confCanvas.getContext('2d');

const colors = ['#a855f7','#6d28d9','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#14b8a6'];
let angle = 0;
let spinning = false;
let pieces = [];
let confettiRunning = false;
let audioCtx = null;

function resizeConfetti() {
  confCanvas.width = window.innerWidth;
  confCanvas.height = window.innerHeight;
}
resizeConfetti();
window.addEventListener('resize', resizeConfetti);

function getNames() {
  return textarea.value.split('\n').map(n => n.trim()).filter(n => n);
}

function draw() {
  const names = getNames();
  const size = canvas.width;
  const c = size / 2;
  ctx.clearRect(0, 0, size, size);

  if (names.length === 0) {
    ctx.fillStyle = '#ffffff20';
    ctx.beginPath();
    ctx.arc(c, c, c - 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Namen eintragen', c, c);
    return;
  }

  const slice = (Math.PI * 2) / names.length;
  names.forEach((name, i) => {
    const start = angle + i * slice;
    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, c - 10, start, start + slice);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px Arial';
    ctx.fillText(name.length > 14 ? name.slice(0, 13) + '…' : name, c - 40, 10);
    ctx.restore();
  });
}

/* ---------- Sound ---------- */
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, start, dur, type, vol) {
  const a = getAudio();
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, a.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, a.currentTime + start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + start + dur);
  o.connect(g);
  g.connect(a.destination);
  o.start(a.currentTime + start);
  o.stop(a.currentTime + start + dur + 0.05);
}
function winSound() {
  try {
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => tone(f, i * 0.12, 0.35, 'triangle', 0.25));
    tone(1047, 0.55, 0.8, 'sine', 0.25);
    tone(1319, 0.55, 0.8, 'sine', 0.18);
  } catch (e) {}
}
function tick() {
  try { tone(900, 0, 0.04, 'square', 0.05); } catch (e) {}
}

/* ---------- Konfetti ---------- */
function burst() {
  const w = confCanvas.width;
  const h = confCanvas.height;
  for (let i = 0; i < 220; i++) {
    const fromLeft = i % 2 === 0;
    pieces.push({
      x: fromLeft ? 0 : w,
      y: h * 0.75,
      vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 12),
      vy: -(8 + Math.random() * 16),
      size: 6 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.4,
      life: 0
    });
  }
  if (!confettiRunning) {
    confettiRunning = true;
    requestAnimationFrame(stepConfetti);
  }
}
function stepConfetti() {
  cctx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  pieces.forEach(p => {
    p.vy += 0.35;
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life++;
    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    cctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    cctx.restore();
  });
  pieces = pieces.filter(p => p.y < confCanvas.height + 40 && p.life < 400);
  if (pieces.length > 0) {
    requestAnimationFrame(stepConfetti);
  } else {
    confettiRunning = false;
    cctx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  }
}

function celebrate(name) {
  winnerEl.textContent = '🎉 ' + name + ' 🎉';
  winnerEl.classList.remove('celebrate');
  void winnerEl.offsetWidth;
  winnerEl.classList.add('celebrate');
  bigName.textContent = name;
  overlay.classList.add('show');
  winSound();
  burst();
  setTimeout(burst, 500);
  setTimeout(burst, 1100);
}

closeBtn.addEventListener('click', () => overlay.classList.remove('show'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });

function spin() {
  const names = getNames();
  if (spinning || names.length < 2) {
    if (names.length < 2) winnerEl.textContent = 'Mindestens 2 Namen eintragen!';
    return;
  }
  getAudio();
  spinning = true;
  spinBtn.disabled = true;
  winnerEl.classList.remove('celebrate');
  winnerEl.textContent = '...';

  const extra = Math.PI * 2 * (6 + Math.random() * 4);
  const startAngle = angle;
  const duration = 5500;
  const startTime = performance.now();
  const slice = (Math.PI * 2) / names.length;
  let lastIndex = -1;

  function currentIndex() {
    const pointerAngle = ((3 * Math.PI / 2) - angle) % (Math.PI * 2);
    const norm = (pointerAngle + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(norm / slice) % names.length;
  }

  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 4);
    angle = startAngle + extra * ease;
    draw();
    const idx = currentIndex();
    if (idx !== lastIndex) { tick(); lastIndex = idx; }
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      spinBtn.disabled = false;
      celebrate(names[currentIndex()]);
    }
  }
  requestAnimationFrame(frame);
}

textarea.addEventListener('input', draw);
spinBtn.addEventListener('click', spin);

/* ---------- TikTok Chat (!join) ---------- */
const joinToggle = document.getElementById('joinToggle');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const seen = new Set();
let ws = null;

function syncSeen() {
  seen.clear();
  getNames().forEach(n => seen.add(n.toLowerCase()));
}
syncSeen();
textarea.addEventListener('input', syncSeen);

function addName(name) {
  const key = name.trim().toLowerCase();
  if (!key || seen.has(key)) return;
  seen.add(key);
  textarea.value = (textarea.value.trim() ? textarea.value.trim() + '\n' : '') + name.trim();
  draw();
}

function connectWS() {
  ws = new WebSocket('ws://localhost:8080');
  ws.onopen = () => { statusText.textContent = 'Programm verbunden, warte auf Live'; };
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === 'status') {
      dot.classList.toggle('on', d.live);
      statusText.textContent = d.live ? 'Live verbunden' : 'Nicht live';
      if (d.live) joinToggle.checked = true;
    }
    if (d.type === 'join' && joinToggle.checked && !spinning) {
      addName(d.name);
    }
  };
  ws.onclose = () => {
    dot.classList.remove('on');
    statusText.textContent = 'Programm nicht gefunden, neuer Versuch ...';
    setTimeout(connectWS, 3000);
  };
}
connectWS();

draw();
</script>
</body>
</html>
